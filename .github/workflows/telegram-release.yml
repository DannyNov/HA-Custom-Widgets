name: Telegram final release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing final release tag (check prior delivery before dispatch)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  notify:
    # Never resend on rerun, including after an ambiguous network failure.
    if: ${{ github.run_attempt == 1 && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish once to the channel
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            const tag = manual ? process.env.RELEASE_TAG : context.payload.release?.tag_name;
            if (!/^v?\d+\.\d+\.\d+(?:\.\d+)?$/.test(tag || '')) {
              if (manual) core.setFailed('Enter an existing final version tag.');
              else core.notice('Not a final version tag; skipped.');
              return;
            }
            const release = manual
              ? (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data
              : context.payload.release;
            if (release.tag_name !== tag || release.draft || release.prerelease) {
              core.setFailed('Release must match the requested tag and be final, not draft or prerelease.');
              return;
            }
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID;
            if (!token || !chatId) {
              core.setFailed('Telegram secrets are missing; no message sent.');
              return;
            }
            // Do not log request URLs or exceptions: they may contain the token.
            async function telegram(method, payload) {
              try {
                const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify(payload),
                  signal: AbortSignal.timeout(30000)
                });
                const data = await response.json();
                if (!response.ok || !data.ok) throw new Error();
                return data.result;
              } catch {
                throw new Error('Telegram request failed. Inspect the channel before any manual retry; delivery may have succeeded.');
              }
            }
            const chat = await telegram('getChat', {chat_id: chatId});
            if (chat.type !== 'channel' || (chat.username || '').toLowerCase() !== 'hacustomwidgets') {
              core.setFailed('Destination must be the HACustomWidgets channel.');
              return;
            }
            // Keep release prose and link labels, with the Release page as the only URL.
            // This transforms only the Telegram copy, never the GitHub Release.
            const withoutUrls = text => text
              .replace(/!?\[([^\]]*)\]\(https?:\/\/[^\s)]+\)/gi, '$1')
              .replace(/https?:\/\/[^\s<>]+/gi, '')
              .replace(/www\.[^\s<>]+/gi, '');
            const title = withoutUrls(`${release.name || release.tag_name} (${release.tag_name})`).slice(0, 300);
            const footer = `\n\nGitHub Release: ${release.html_url}`;
            // Plain text: no Markdown/HTML parsing, shell interpolation or code evaluation.
            // JS length counts UTF-16 units, conservatively handling emoji as well.
            const budget = Math.max(0, 4000 - title.length - footer.length - 4);
            const body = withoutUrls(release.body || 'Новая версия опубликована.');
            const excerpt = body.length > budget ? body.slice(0, Math.max(0, budget - 1)).replace(/[\uD800-\uDBFF]$/, '') + '…' : body;
            const sent = await telegram('sendMessage', {
              chat_id: chat.id,
              text: `${title}\n\n${excerpt}${footer}`,
              link_preview_options: {is_disabled: true}
            });
            core.info(`Telegram message sent: ${sent.message_id}; release tag: ${tag}`);
            await core.summary.addRaw(`Telegram message sent: ${sent.message_id}\nRelease: ${release.html_url}\nDestination: @HACustomWidgets\nOnly URL: GitHub Release (no direct APK link).`).write();

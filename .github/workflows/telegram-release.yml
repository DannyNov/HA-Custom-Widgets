name: Telegram final release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing final release tag (check prior delivery before dispatch)'
        required: true
        type: string
      replace_v061_message_4:
        description: 'Replace only v0.6.1 message 4 in @HACustomWidgets (delete, then send)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: telegram-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  notify:
    # Never resend on rerun, including after an ambiguous network failure.
    if: ${{ github.run_attempt == 1 && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish once to the channel
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPLACE_V061_MESSAGE_4: ${{ inputs.replace_v061_message_4 }}
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            const tag = manual ? process.env.RELEASE_TAG : context.payload.release?.tag_name;
            if (!/^v?\d+\.\d+\.\d+(?:\.\d+)?$/.test(tag || '')) {
              if (manual) core.setFailed('Enter an existing final version tag.');
              else core.notice('Not a final version tag; skipped.');
              return;
            }
            const release = manual
              ? (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data
              : context.payload.release;
            if (release.tag_name !== tag || release.draft || release.prerelease) {
              core.setFailed('Release must match the requested tag and be final, not draft or prerelease.');
              return;
            }
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID;
            if (!token || !chatId) {
              core.setFailed('Telegram secrets are missing; no message sent.');
              return;
            }
            // Do not log request URLs or exceptions: they may contain the token.
            async function telegram(method, payload) {
              try {
                const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify(payload),
                  signal: AbortSignal.timeout(30000)
                });
                const data = await response.json();
                if (!response.ok || !data.ok) throw new Error();
                return data.result;
              } catch {
                throw new Error('Telegram request failed. Inspect the channel before any manual retry; delivery may have succeeded.');
              }
            }
            const chat = await telegram('getChat', {chat_id: chatId});
            if (chat.type !== 'channel' || (chat.username || '').toLowerCase() !== 'hacustomwidgets') {
              core.setFailed('Destination must be the HACustomWidgets channel.');
              return;
            }
            // Only an explicitly curated announcement may become Telegram prose.
            // This transforms only the Telegram copy, never the GitHub Release.
            const withoutUrls = text => text
              .replace(/!?\[([^\]]*)\]\(https?:\/\/[^\s)]+\)/gi, '$1')
              .replace(/https?:\/\/[^\s<>]+/gi, '')
              .replace(/www\.[^\s<>]+/gi, '');
            const releaseName = withoutUrls(release.name || tag).trim();
            const title = (releaseName.includes(tag) ? releaseName : `${releaseName} (${tag})`).slice(0, 300);
            const footer = `\n\nGitHub Release: ${release.html_url}`;
            // Require exactly one correctly ordered pair; never fall back to full release prose.
            const source = release.body || '';
            const startMarker = '<!-- telegram:start -->';
            const endMarker = '<!-- telegram:end -->';
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker);
            const validBlock = start >= 0 && end > start
              && source.indexOf(startMarker, start + startMarker.length) === -1
              && source.indexOf(endMarker, end + endMarker.length) === -1;
            const announcement = validBlock
              ? withoutUrls(source.slice(start + startMarker.length, end)).trim() : '';
            const fallback = 'RU: Новая версия опубликована.\n\nEN: A new release is available.';
            // Fail closed to a short fallback for oversized or diagnostic blocks.
            const diagnostics = /build identity|package\s*:|versioncode|minSdk|targetSdk|certificate|(?:commit|APK|source)\s*(?:SHA|:)|SHA[-\s]?256|\bCI\s*:|(?:unit|regression|host)\s+tests?|test\s+counts?/i;
            const body = announcement && announcement.length <= 1200 && !diagnostics.test(announcement)
              ? announcement : fallback;
            // Plain text, one Release URL, with no Markdown/HTML parsing.
            const message = `${title}\n\n${body}${footer}`;
            if (message.length > 2000) {
              core.setFailed('Announcement exceeds the short-message limit; nothing sent.');
              return;
            }
            const replacing = process.env.REPLACE_V061_MESSAGE_4 === 'true';
            if (replacing) {
              if (!manual || tag !== 'v0.6.1' || !announcement || body === fallback) {
                core.setFailed('Replacement requires manual v0.6.1 with a valid short announcement.');
                return;
              }
              // This bot sent message 4. can_post_messages permits deleting its own channel posts.
              const bot = await telegram('getMe', {});
              const member = await telegram('getChatMember', {chat_id: chat.id, user_id: bot.id});
              if (member.status !== 'administrator' || !(member.can_post_messages || member.can_delete_messages)) {
                core.setFailed('Deletion requires can_post_messages for this bot own post, or can_delete_messages. No permissions changed; nothing deleted or sent.');
                return;
              }
              // No retries: an ambiguous delete must never lead to an extra post.
              const deleted = await telegram('deleteMessage', {chat_id: chat.id, message_id: 4});
              if (deleted !== true) {
                core.setFailed('Deletion of message 4 was not confirmed; nothing sent.');
                return;
              }
              core.info('Deleted message 4 in @HACustomWidgets.');
              await core.summary.addRaw('Deleted message 4 in @HACustomWidgets.\n').write();
            }
            const sent = await telegram('sendMessage', {
              chat_id: chat.id,
              text: message,
              link_preview_options: {is_disabled: true}
            });
            core.info(`Telegram message sent: ${sent.message_id}; release tag: ${tag}`);
            await core.summary.addRaw(`Telegram message sent: ${sent.message_id}\nRelease: ${release.html_url}\nDestination: @HACustomWidgets\nOnly URL: GitHub Release (no direct APK link).`).write();

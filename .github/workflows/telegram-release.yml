name: Telegram final release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: telegram-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  notify:
    # Never resend on rerun, including after an ambiguous network failure.
    if: ${{ !github.event.release.draft && !github.event.release.prerelease && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish once to the channel
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const release = context.payload.release;
            if (!/^v?\d+\.\d+\.\d+(?:\.\d+)?$/.test(release.tag_name)) {
              core.notice('Not a final version tag; skipped.');
              return;
            }
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID;
            if (!token || !chatId) {
              core.notice('Telegram secrets are missing; no message sent. Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID for future releases.');
              return;
            }
            // Do not log request URLs or exceptions: they may contain the token.
            async function telegram(method, payload) {
              try {
                const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify(payload),
                  signal: AbortSignal.timeout(30000)
                });
                const data = await response.json();
                if (!response.ok || !data.ok) throw new Error();
                return data.result;
              } catch {
                throw new Error('Telegram request failed. Inspect the channel before any manual retry; delivery may have succeeded.');
              }
            }
            const chat = await telegram('getChat', {chat_id: chatId});
            if (chat.type !== 'channel' || (chat.username || '').toLowerCase() !== 'hacustomwidgets') {
              core.setFailed('Destination must be the HACustomWidgets channel.');
              return;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100
            });
            const apk = assets.find(a => a.state === 'uploaded' && a.name === `HAWidgets-${release.tag_name}.apk`)
              || assets.find(a => a.state === 'uploaded' && a.name.toLowerCase().endsWith('.apk'));
            const title = `${release.name || release.tag_name} (${release.tag_name})`.slice(0, 300);
            const footer = `\n\nGitHub Release: ${release.html_url}` + (apk ? `\nAPK: ${apk.browser_download_url}` : '');
            // Plain text: no Markdown/HTML parsing, shell interpolation or code evaluation.
            // JS length counts UTF-16 units, conservatively handling emoji as well.
            const budget = Math.max(0, 4000 - title.length - footer.length - 4);
            const body = release.body || 'Новая версия опубликована.';
            const excerpt = body.length > budget ? body.slice(0, Math.max(0, budget - 1)).replace(/[\uD800-\uDBFF]$/, '') + '…' : body;
            const sent = await telegram('sendMessage', {
              chat_id: chat.id,
              text: `${title}\n\n${excerpt}${footer}`,
              link_preview_options: {is_disabled: true}
            });
            await core.summary.addRaw(`Telegram message sent: ${sent.message_id}`).write();

name: Publish verified v0.8.0 RC1 only
on:
  push:
    branches: [feature/maintenance-v080]
permissions:
  contents: read
  actions: read
jobs:
  publish-rc:
    if: github.ref == 'refs/heads/feature/maintenance-v080' && contains(github.event.head_commit.message, '[publish-v080-rc1]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    concurrency:
      group: publish-v0.8.0-rc1
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: b733daeae463bac15a909264f624efbae463af77
      CONTROLLER_SHA: ${{ github.sha }}
      TAG: v0.8.0-rc1
      EXPECTED_CODE: '91'
      CI_RUN: '37455855104'
      SIGNED_RUN: '37455855162'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: b733daeae463bac15a909264f624efbae463af77
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Wait for exact-source full gate and preserve release discipline
        run: |
          set -euo pipefail
          test "$GH_REPO" = DannyNov/HA-Custom-Widgets
          git merge-base --is-ancestor "$SOURCE_SHA" "$CONTROLLER_SHA"
          git diff --exit-code "$SOURCE_SHA" "$CONTROLLER_SHA" -- . ':!.github/workflows/publish-v080-rc.yml'
          # Superseded code90 is never published; preserve its successful signed artifact.
          if test "$(gh api "repos/$GH_REPO/actions/runs/37455360180" --jq .status)" != completed; then gh run cancel 37455360180; fi
          for attempt in $(seq 1 140); do
            finished=true
            for id in "$CI_RUN" "$SIGNED_RUN"; do
              run=$(gh api "repos/$GH_REPO/actions/runs/$id")
              test "$(jq -r .head_sha <<< "$run")" = "$SOURCE_SHA"
              test "$(jq -r .event <<< "$run")" = push
              if test "$(jq -r .status <<< "$run")" != completed; then finished=false; else test "$(jq -r .conclusion <<< "$run")" = success; fi
            done
            if $finished; then break; fi
            sleep 30
          done
          $finished
          gh api "repos/$GH_REPO/actions/runs/$CI_RUN/jobs?per_page=100" > exact-gate-jobs.json
          test "$(jq '[.jobs[] | select(.name != "fixture-persistence-diagnostic")] | length' exact-gate-jobs.json)" = 26
          test "$(jq '[.jobs[] | select(.name != "fixture-persistence-diagnostic" and .conclusion != "success")] | length' exact-gate-jobs.json)" = 0
          test "$(jq '[.jobs[] | select(.name | startswith("upgrade ("))] | length' exact-gate-jobs.json)" = 23
          grep -F 'versionCode = 91' app/build.gradle.kts
          grep -F 'versionName = "0.8.0-rc1"' app/build.gradle.kts
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = 2568552bf0d46c37ba91a75c2508b4d31a6e0fd4
          test "$(gh api "repos/$GH_REPO/pulls/8" --jq .merged)" = false
          # Save full pre-existing public release metadata for post-publication comparison.
          gh api "repos/$GH_REPO/releases?per_page=100" > releases-before.json
      - name: Independently inspect signed APK and AAB before publication
        run: |
          set -euo pipefail
          gh run download "$SIGNED_RUN" --name HA-Custom-Widgets-v0.8.0-rc1-release --dir rc-assets
          mkdir deliverables
          cp rc-assets/apk/release/HAWidgets-v0.8.0-rc1.apk deliverables/
          cp rc-assets/bundle/release/app-release.aab deliverables/HAWidgets-v0.8.0-rc1.aab
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          apk=deliverables/HAWidgets-v0.8.0-rc1.apk
          "$APKSIGNER" verify --verbose --print-certs "$apk" | tee deliverables/signature.txt
          cert=$(sed -n 's/^.*certificate SHA-256 digest: //p' deliverables/signature.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$cert" = 8bbb9530cc7954da1fc576f1174dc0dbaaec574d15c024de1ebd6a090d48037a
          "$AAPT" dump badging "$apk" | tee deliverables/manifest.txt
          grep -F "package: name='com.danila.hacustomwidgets' versionCode='$EXPECTED_CODE' versionName='0.8.0-rc1'" deliverables/manifest.txt
          grep -Fx "sdkVersion:'31'" deliverables/manifest.txt
          grep -Fx "targetSdkVersion:'36'" deliverables/manifest.txt
          ! grep -q '^application-debuggable:' deliverables/manifest.txt
          jarsigner -verify deliverables/HAWidgets-v0.8.0-rc1.aab | tee deliverables/aab-signature.txt
          grep -F 'jar verified.' deliverables/aab-signature.txt
          keytool -printcert -jarfile deliverables/HAWidgets-v0.8.0-rc1.aab > deliverables/aab-certificate.txt
          grep -F '8B:BB:95:30:CC:79:54:DA:1F:C5:76:F1:17:4D:C0:DB:AA:EC:57:4D:15:C0:24:DE:1E:BD:6A:09:0D:48:03:7A' deliverables/aab-certificate.txt
          curl --fail --location 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' -o bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar' | sha256sum -c -
          java -jar bundletool.jar dump manifest --bundle=deliverables/HAWidgets-v0.8.0-rc1.aab --module=base > deliverables/aab-manifest.xml
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          root=ET.parse('deliverables/aab-manifest.xml').getroot()
          ns='{http://schemas.android.com/apk/res/android}'
          assert root.get('package')=='com.danila.hacustomwidgets'
          assert root.get(ns+'versionCode')==os.environ['EXPECTED_CODE']
          assert root.get(ns+'versionName')=='0.8.0-rc1'
          sdk=root.find('uses-sdk')
          assert sdk.get(ns+'minSdkVersion')=='31' and sdk.get(ns+'targetSdkVersion')=='36'
          assert root.find('application').get(ns+'debuggable','false')=='false'
          PY
          cp rc-assets/apk/release/build-info.txt deliverables/build-info.txt
          printf 'sourceSHA=%s\nciRun=%s\nsignedRun=%s\n' "$SOURCE_SHA" "$CI_RUN" "$SIGNED_RUN" >> deliverables/build-info.txt
          (cd deliverables && sha256sum HAWidgets-v0.8.0-rc1.apk HAWidgets-v0.8.0-rc1.aab > sha256.txt)
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.0.3" --jq .object.sha)" = f8c7a9c8a9a11d823873a274ae9f2eb340314499
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.1" --jq .object.sha)" = af315c33410b8833f3339ee13682081ff8819f2a
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.1-rc6" --jq .object.sha)" = 7cd3cc5ca5238cd330c7dedf91f107f33bc3e737
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.1-rc7" --jq .object.sha)" = ba8847701e14ccd43dccdd15847c892330dcc6a4
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.1.1" --jq .object.sha)" = df0fff631634657403b5436d8a7440de91f79cba
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.1.1-rc1" --jq .object.sha)" = 7fe94a6bee9c0994161a046b73f978b37074043c
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.2" --jq .object.sha)" = 718136bb62386ffbfff3bcdd18de4d403ad14d70
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.2-rc1" --jq .object.sha)" = 7f133dd7aafb60c937c5c7e3067596806a9a6502
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3" --jq .object.sha)" = c26bb1af90872db9a6bfb49ede693294d6a2fd51
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc1" --jq .object.sha)" = 41c35c0f736a06bebd5d167b495923d13e751640
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc2" --jq .object.sha)" = 484fda6ba2cc7b1620f187309fff6246ec4a9d28
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc3" --jq .object.sha)" = 184d71d8003000f933330330628e41f3ddf20b47
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc4" --jq .object.sha)" = ba2bb30e8ab3ff79888f7766f0b5070eca1e80a6
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc5" --jq .object.sha)" = ce38f2a889410b50be130644bb4fe99edb93e24d
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc6" --jq .object.sha)" = 99e97b987db3467ff036dafe74e605c661c33796
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc7" --jq .object.sha)" = 900756d2960ada770ec580a0e6ec3c7d8d27ffb4
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc8" --jq .object.sha)" = a588b78539144ed0c3dfac3493f46cdf544d3824
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.4" --jq .object.sha)" = 273a6d60360b295523f23bd4b416a34ff4cb2d2b
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.4-rc1" --jq .object.sha)" = 66298240b6707c3e3d40e6d60ce079e2be664efe
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.7.0" --jq .object.sha)" = 58a39ededb89c325e17da016c134726c7c5e0374
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.7.0-rc1" --jq .object.sha)" = afece5e292314a145d4822d7702b992f0f05be1f
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.7.0-rc2" --jq .object.sha)" = 00fdbf0ab983db90d2ad8f6ff25961fb3e6652dc
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.7.0-rc3" --jq .object.sha)" = 42ef1127af68f1b8d475132e92004bb7a0588bca
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.7.0-rc4" --jq .object.sha)" = 248c91175b473a5b8be11d0fcdf381f23f67c884
      - name: Publish public Pre-release and verify public downloads
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then echo 'RC already exists; refusing to overwrite'; exit 1; fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then echo 'Tag already exists; refusing to move it'; exit 1; fi
          test "$(gh api "repos/$GH_REPO/git/ref/heads/feature/maintenance-v080" --jq .object.sha)" = "$CONTROLLER_SHA"
          gh release create "$TAG" deliverables/HAWidgets-v0.8.0-rc1.apk deliverables/HAWidgets-v0.8.0-rc1.aab deliverables/sha256.txt deliverables/build-info.txt deliverables/signature.txt \
            --target "$SOURCE_SHA" --title 'HA Custom Widgets v0.8.0-rc1' --notes-file RELEASE_NOTES_v0.8.0-rc1.md --prerelease --latest=false
          gh release view "$TAG" --json url,isDraft,isPrerelease,tagName,targetCommitish | tee deliverables/release.json
          test "$(jq -r .isPrerelease deliverables/release.json)" = true
          test "$(jq -r .isDraft deliverables/release.json)" = false
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)" = "$SOURCE_SHA"
          mkdir public-assets
          for extension in apk aab; do
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/$GH_REPO/releases/download/$TAG/HAWidgets-v0.8.0-rc1.$extension" -o "public-assets/HAWidgets-v0.8.0-rc1.$extension"
            cmp "deliverables/HAWidgets-v0.8.0-rc1.$extension" "public-assets/HAWidgets-v0.8.0-rc1.$extension"
          done
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs public-assets/HAWidgets-v0.8.0-rc1.apk | tee public-assets/signature.txt
          grep -F '8bbb9530cc7954da1fc576f1174dc0dbaaec574d15c024de1ebd6a090d48037a' public-assets/signature.txt
          "$AAPT" dump badging public-assets/HAWidgets-v0.8.0-rc1.apk | tee public-assets/manifest.txt
          grep -F "package: name='com.danila.hacustomwidgets' versionCode='$EXPECTED_CODE' versionName='0.8.0-rc1'" public-assets/manifest.txt
          grep -Fx "sdkVersion:'31'" public-assets/manifest.txt
          grep -Fx "targetSdkVersion:'36'" public-assets/manifest.txt
          ! grep -q '^application-debuggable:' public-assets/manifest.txt
          jarsigner -verify public-assets/HAWidgets-v0.8.0-rc1.aab | tee public-assets/aab-signature.txt
          grep -F 'jar verified.' public-assets/aab-signature.txt
          keytool -printcert -jarfile public-assets/HAWidgets-v0.8.0-rc1.aab > public-assets/aab-certificate.txt
          grep -F '8B:BB:95:30:CC:79:54:DA:1F:C5:76:F1:17:4D:C0:DB:AA:EC:57:4D:15:C0:24:DE:1E:BD:6A:09:0D:48:03:7A' public-assets/aab-certificate.txt
          java -jar bundletool.jar dump manifest --bundle=public-assets/HAWidgets-v0.8.0-rc1.aab --module=base > public-assets/aab-manifest.xml
          cmp deliverables/aab-manifest.xml public-assets/aab-manifest.xml
          (cd public-assets && sha256sum HAWidgets-v0.8.0-rc1.apk HAWidgets-v0.8.0-rc1.aab > sha256.txt)
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = 2568552bf0d46c37ba91a75c2508b4d31a6e0fd4
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.7.0-rc1" --jq .object.sha)" = afece5e292314a145d4822d7702b992f0f05be1f


          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.0.3" --jq .object.sha)" = f8c7a9c8a9a11d823873a274ae9f2eb340314499
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.1" --jq .object.sha)" = af315c33410b8833f3339ee13682081ff8819f2a
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.1-rc6" --jq .object.sha)" = 7cd3cc5ca5238cd330c7dedf91f107f33bc3e737
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.1-rc7" --jq .object.sha)" = ba8847701e14ccd43dccdd15847c892330dcc6a4
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.1.1" --jq .object.sha)" = df0fff631634657403b5436d8a7440de91f79cba
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.1.1-rc1" --jq .object.sha)" = 7fe94a6bee9c0994161a046b73f978b37074043c
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.2" --jq .object.sha)" = 718136bb62386ffbfff3bcdd18de4d403ad14d70
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.2-rc1" --jq .object.sha)" = 7f133dd7aafb60c937c5c7e3067596806a9a6502
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3" --jq .object.sha)" = c26bb1af90872db9a6bfb49ede693294d6a2fd51
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc1" --jq .object.sha)" = 41c35c0f736a06bebd5d167b495923d13e751640
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc2" --jq .object.sha)" = 484fda6ba2cc7b1620f187309fff6246ec4a9d28
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc3" --jq .object.sha)" = 184d71d8003000f933330330628e41f3ddf20b47
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc4" --jq .object.sha)" = ba2bb30e8ab3ff79888f7766f0b5070eca1e80a6
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc5" --jq .object.sha)" = ce38f2a889410b50be130644bb4fe99edb93e24d
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc6" --jq .object.sha)" = 99e97b987db3467ff036dafe74e605c661c33796
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc7" --jq .object.sha)" = 900756d2960ada770ec580a0e6ec3c7d8d27ffb4
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.3-rc8" --jq .object.sha)" = a588b78539144ed0c3dfac3493f46cdf544d3824
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.4" --jq .object.sha)" = 273a6d60360b295523f23bd4b416a34ff4cb2d2b
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.4-rc1" --jq .object.sha)" = 66298240b6707c3e3d40e6d60ce079e2be664efe
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.7.0" --jq .object.sha)" = 58a39ededb89c325e17da016c134726c7c5e0374
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.7.0-rc1" --jq .object.sha)" = afece5e292314a145d4822d7702b992f0f05be1f
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.7.0-rc2" --jq .object.sha)" = 00fdbf0ab983db90d2ad8f6ff25961fb3e6652dc
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.7.0-rc3" --jq .object.sha)" = 42ef1127af68f1b8d475132e92004bb7a0588bca
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.7.0-rc4" --jq .object.sha)" = 248c91175b473a5b8be11d0fcdf381f23f67c884
          gh api "repos/$GH_REPO/releases?per_page=100" > releases-after.json
          python3 - <<'PY'
          import json
          before=json.load(open('releases-before.json')); after={r['id']:r for r in json.load(open('releases-after.json'))}
          for release in before:
              current=after[release['id']]
              for field in ('tag_name','draft','prerelease','target_commitish'):
                  assert release[field]==current[field], (release['tag_name'],field)
              assert [(a['id'],a['name'],a['digest']) for a in release['assets']]==[(a['id'],a['name'],a['digest']) for a in current['assets']]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.8.0-rc1-public-verification
          path: |
            deliverables
            public-assets
          if-no-files-found: error

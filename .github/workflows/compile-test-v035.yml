name: v0.6.3 compile and tests

on:
  push:
  workflow_dispatch:

jobs:
  compile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify RC lineage and monotonic version
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 718136bb62386ffbfff3bcdd18de4d403ad14d70 HEAD
          git merge-base --is-ancestor 41c35c0f736a06bebd5d167b495923d13e751640 HEAD
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          current = Path("app/build.gradle.kts").read_text()
          assert 'versionName = "0.6.3-rc2"' in current
          assert 'versionCode = 52' in current
          base = subprocess.check_output(["git", "show", "v0.6.2:app/build.gradle.kts"], text=True)
          assert current == base.replace("versionCode = 49", "versionCode = 52").replace('versionName = "0.6.2"', 'versionName = "0.6.3-rc2"')
          history = subprocess.check_output(["git", "log", "--all", "-p", "--", "app/build.gradle.kts"], text=True)
          codes = [int(x) for x in re.findall(r"^[+ -]\s*versionCode\s*=\s*(\d+)", history, re.M)]
          assert codes and max(codes) == 52
          refs = subprocess.check_output(["git", "for-each-ref", "--format=%(refname)", "refs/tags"], text=True).splitlines()
          for ref in refs:
              old = subprocess.check_output(["git", "show", f"{ref}:app/build.gradle.kts"], text=True)
              code = re.search(r"versionCode\s*=\s*(\d+)", old)
              assert code and int(code[1]) < 52, (ref, code)
          print("RC_LINEAGE_PASS: v0.6.2 ancestor; versionCode=52; signing, SDK and dependencies unchanged")
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile and run unit/regression tests
        run: gradle testDebugUnitTest assembleDebugAndroidTest --stacktrace
      - name: Report executed tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          reports = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          if not reports:
              raise SystemExit("No JUnit XML reports found")
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("TEST_RESULT " + " ".join(f"{key}={value}" for key, value in totals.items()))
          if totals["tests"] < 414 or totals["failures"] or totals["errors"] or totals["skipped"]:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v0.6.1-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: error

  glance-host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [31, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace || { adb logcat -d -s AppWidgetHostView AndroidRuntime; exit 1; }
      - name: Verify instrumentation test count
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          reports = glob.glob("app/build/outputs/androidTest-results/connected/**/TEST-*.xml", recursive=True)
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("HOST_TEST_RESULT", totals)
          if totals["tests"] < 10 or any(totals[k] for k in ("failures", "errors", "skipped")):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.6.1-glance-api-${{ matrix.api }}
          path: |
            seed-result.txt
            pre-upgrade-result.txt
            upgrade-result.txt
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected

  upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: v0.6.0.3
            ref: f8c7a9c8a9a11d823873a274ae9f2eb340314499
          - source: rc6
            ref: 7cd3cc5ca5238cd330c7dedf91f107f33bc3e737
          - source: v0.6.1.1-rc1
            ref: 7fe94a6bee9c0994161a046b73f978b37074043c
          - source: v0.6.2
            ref: 718136bb62386ffbfff3bcdd18de4d403ad14d70
            fixture: true
            legacy: false
          - source: v0.6.1
            ref: 8de943565dee235213ae5abb3e87f7bbd08179f2
          - source: stable-without-legacy
            ref: df0fff631634657403b5436d8a7440de91f79cba
            fixture: true
            legacy: false
          - source: stable-with-legacy
            ref: df0fff631634657403b5436d8a7440de91f79cba
            fixture: true
            legacy: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build source and corrective upgrade APKs with one debug certificate
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/upgrade-base"
          git worktree add --detach "$base_dir" "${{ matrix.ref }}"
          gradle -p "$base_dir" assembleDebug --stacktrace
          if [ "${{ matrix.fixture }}" = "true" ]; then
            fixture=app/src/androidTest/java/com/danila/hacustomwidgets/dashboard/DashboardUpgradeTest.kt
            mkdir -p "$base_dir/$(dirname "$fixture")"
            cp "$fixture" "$base_dir/$fixture"
            gradle -p "$base_dir" assembleDebugAndroidTest --stacktrace
            cp "$base_dir/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" "$RUNNER_TEMP/source-test.apk"
          fi
          cp "$base_dir/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/source.apk"
          gradle assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/source.apk"
            adb shell run-as com.danila.hacustomwidgets mkdir -p files
            adb shell run-as com.danila.hacustomwidgets touch files/upgrade-marker
            if [ "${{ matrix.fixture }}" = "true" ]; then adb install "$RUNNER_TEMP/source-test.apk"; adb shell appwidget grantbind --package com.danila.hacustomwidgets --user 0; adb shell am instrument -w -e class com.danila.hacustomwidgets.dashboard.DashboardUpgradeTest -e upgradePhase seed -e withLegacy "${{ matrix.legacy }}" com.danila.hacustomwidgets.test/androidx.test.runner.AndroidJUnitRunner | tee seed-result.txt; grep -F 'OK (1 test)' seed-result.txt; fi
            if [ "${{ matrix.fixture }}" = "true" ]; then adb shell am instrument -w -e class com.danila.hacustomwidgets.dashboard.DashboardUpgradeTest -e upgradePhase preUpgrade com.danila.hacustomwidgets.test/androidx.test.runner.AndroidJUnitRunner | tee pre-upgrade-result.txt; grep -F 'OK (1 test)' pre-upgrade-result.txt; fi
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell run-as com.danila.hacustomwidgets ls files/upgrade-marker | grep -F 'files/upgrade-marker'
            if [ "${{ matrix.fixture }}" = "true" ]; then adb shell am instrument -w -e class com.danila.hacustomwidgets.dashboard.DashboardUpgradeTest -e upgradePhase verify com.danila.hacustomwidgets.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-result.txt; grep -F 'OK (1 test)' upgrade-result.txt; fi
            gradle connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.6.1-upgrade-${{ matrix.source }}-api-31
          path: |
            seed-result.txt
            pre-upgrade-result.txt
            upgrade-result.txt
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected

  fixture-persistence-diagnostic:
    # Reproduce the original fixture failure before any APK upgrade, then verify the fix.
    if: github.ref == 'refs/heads/feature/remove-entity-widget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build unchanged stable app and original versus corrected test APKs
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/stable" df0fff631634657403b5436d8a7440de91f79cba
          gradle -p "$RUNNER_TEMP/stable" assembleDebug
          cp "$RUNNER_TEMP/stable/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/stable.apk"
          fixture=app/src/androidTest/java/com/danila/hacustomwidgets/dashboard/DashboardUpgradeTest.kt
          cp "$fixture" "$RUNNER_TEMP/corrected.kt"
          git show 7f133dd7aafb60c937c5c7e3067596806a9a6502:"$fixture" > "$fixture"
          gradle assembleDebugAndroidTest
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/original-test.apk"
          cp "$RUNNER_TEMP/corrected.kt" "$fixture"
          gradle assembleDebugAndroidTest
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/corrected-test.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/stable.apk"
            bash .github/scripts/diagnose-fixture-persistence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-persistence-evidence
          path: fixture-evidence/

  publish-rc:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/brightness-v063' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[publish-rc]')
    needs: [compile-test, glance-host, upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    concurrency:
      group: publish-v0.6.3-rc2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Publish only the fully tested signed Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          TEST_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.6.3-rc2
          test "$GH_REPO" = DannyNov/HA-Custom-Widgets
          grep -F 'versionName = "0.6.3-rc2"' app/build.gradle.kts
          grep -F 'versionCode = 52' app/build.gradle.kts
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'RC already exists; refusing to replace it.' >&2
            exit 1
          fi
          test -z "$(git ls-remote origin "refs/tags/$tag")"
          signed_run=''
          for attempt in $(seq 1 40); do
            run=$(gh api "repos/$GH_REPO/actions/workflows/android.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=10" --jq '.workflow_runs | sort_by(.id) | reverse | .[0] | {id, status, conclusion, head_sha}')
            if test "$(jq -r '.status' <<< "$run")" = completed; then
              test "$(jq -r '.conclusion' <<< "$run")" = success
              test "$(jq -r '.head_sha' <<< "$run")" = "$SOURCE_SHA"
              signed_run=$(jq -r '.id' <<< "$run")
              break
            fi
            sleep 30
          done
          test -n "$signed_run"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/feature/brightness-v063" --jq '.object.sha')" = "$SOURCE_SHA"
          gh run download "$signed_run" --name HA-Custom-Widgets-v0.6.3-rc2-release --dir rc-assets
          asset_dir=rc-assets/apk/release
          apk="$asset_dir/HAWidgets-v0.6.3-rc2.apk"
          test -s "$apk"
          grep -Fx 'applicationId=com.danila.hacustomwidgets' "$asset_dir/build-info.txt"
          grep -Fx 'versionName=0.6.3-rc2' "$asset_dir/build-info.txt"
          grep -Fx 'versionCode=52' "$asset_dir/build-info.txt"
          grep -Fx 'debuggable=false' "$asset_dir/build-info.txt"
          grep -F 'certificate SHA-256 digest: 8bbb9530cc7954da1fc576f1174dc0dbaaec574d15c024de1ebd6a090d48037a' "$asset_dir/signature.txt"
          apk_sha=$(sha256sum "$apk" | cut -d ' ' -f 1)
          test "$apk_sha" = "$(cut -d ' ' -f 1 "$asset_dir/apk-sha256.txt")"
          printf '%s  %s\n' "$apk_sha" HAWidgets-v0.6.3-rc2.apk > "$asset_dir/apk-sha256.txt"
          printf 'sourceCommit=%s\ntestRun=%s\nsignedRun=%s\n' "$SOURCE_SHA" "$TEST_RUN_ID" "$signed_run" >> "$asset_dir/build-info.txt"
          cp rc-assets/bundle/release/app-release.aab "$asset_dir/HAWidgets-v0.6.3-rc2.aab"
          cp RELEASE_NOTES_v0.6.3-rc2.md rc-notes.md
          printf '\nSource: `%s`\n\n[Full CI](https://github.com/%s/actions/runs/%s) · [Signed build](https://github.com/%s/actions/runs/%s)\n\nAPK SHA-256: `%s`\n' "$SOURCE_SHA" "$GH_REPO" "$TEST_RUN_ID" "$GH_REPO" "$signed_run" "$apk_sha" >> rc-notes.md
          gh release create "$tag" "$apk" "$asset_dir/HAWidgets-v0.6.3-rc2.aab" "$asset_dir/apk-sha256.txt" "$asset_dir/build-info.txt" "$asset_dir/signature.txt" \
            --target "$SOURCE_SHA" --title 'HA Custom Widgets v0.6.3-rc2' --notes-file rc-notes.md --prerelease --latest=false
          gh release view "$tag" --json url,isDraft,isPrerelease,tagName,targetCommitish

name: v0.6.1 compile and tests

on:
  push:
  workflow_dispatch:

jobs:
  compile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile and run unit/regression tests
        run: gradle testDebugUnitTest assembleDebugAndroidTest --stacktrace
      - name: Report executed tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          reports = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          if not reports:
              raise SystemExit("No JUnit XML reports found")
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("TEST_RESULT " + " ".join(f"{key}={value}" for key, value in totals.items()))
          if totals["tests"] < 414 or totals["failures"] or totals["errors"] or totals["skipped"]:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v0.6.1-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: error

  glance-host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [31, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace || { adb logcat -d -s AppWidgetHostView AndroidRuntime; exit 1; }
      - name: Verify instrumentation test count
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          reports = glob.glob("app/build/outputs/androidTest-results/connected/**/TEST-*.xml", recursive=True)
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("HOST_TEST_RESULT", totals)
          if totals["tests"] < 10 or any(totals[k] for k in ("failures", "errors", "skipped")):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.6.1-glance-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected

  upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: v0.6.0.3
            ref: f8c7a9c8a9a11d823873a274ae9f2eb340314499
          - source: rc6
            ref: 7cd3cc5ca5238cd330c7dedf91f107f33bc3e737
          - source: v0.6.1
            ref: 8de943565dee235213ae5abb3e87f7bbd08179f2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build source and corrective upgrade APKs with one debug certificate
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/upgrade-base"
          git worktree add --detach "$base_dir" "${{ matrix.ref }}"
          gradle -p "$base_dir" assembleDebug --stacktrace
          cp "$base_dir/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/source.apk"
          gradle assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/source.apk"
            adb shell run-as com.danila.hacustomwidgets mkdir -p files
            adb shell run-as com.danila.hacustomwidgets touch files/upgrade-marker
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell run-as com.danila.hacustomwidgets ls files/upgrade-marker | grep -F 'files/upgrade-marker'
            gradle connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.6.1-upgrade-${{ matrix.source }}-api-31
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected

  publish-rc1:
    # Explicit, one-release authorization. Never publishes from PRs, main or arbitrary tags.
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/catalog-refresh-0.6.1.1'
    needs: [compile-test, glance-host, upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    concurrency:
      group: publish-v0.6.1.1-rc1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Publish the authorized RC after tests and signed build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          TEST_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.6.1.1-rc1
          test "$GH_REPO" = DannyNov/HA-Custom-Widgets
          grep -F 'versionName = "0.6.1.1-rc1"' app/build.gradle.kts
          grep -F 'versionCode = 45' app/build.gradle.kts
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'RC already exists; refusing to replace it.' >&2
            exit 1
          fi
          if test -n "$(git ls-remote origin "refs/tags/$tag")"; then
            echo 'RC tag already exists; refusing to reuse it.' >&2
            exit 1
          fi
          # The signing workflow is independent. Accept only a successful push build of this SHA.
          signed_run=''
          for attempt in $(seq 1 40); do
            run=$(gh api "repos/$GH_REPO/actions/workflows/android.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=10" --jq '.workflow_runs | sort_by(.id) | reverse | .[0] | {id, status, conclusion, head_sha}')
            status=$(jq -r '.status' <<< "$run")
            if test "$status" = completed; then
              test "$(jq -r '.conclusion' <<< "$run")" = success
              test "$(jq -r '.head_sha' <<< "$run")" = "$SOURCE_SHA"
              signed_run=$(jq -r '.id' <<< "$run")
              break
            fi
            sleep 30
          done
          test -n "$signed_run"
          gh run download "$signed_run" --name HA-Custom-Widgets-v0.6.1.1-rc1-release --dir rc-assets
          asset_dir=rc-assets/apk/release
          apk="$asset_dir/HAWidgets-v0.6.1.1-rc1.apk"
          test -s "$apk"
          grep -Fx 'applicationId=com.danila.hacustomwidgets' "$asset_dir/build-info.txt"
          grep -Fx 'versionName=0.6.1.1-rc1' "$asset_dir/build-info.txt"
          grep -Fx 'versionCode=45' "$asset_dir/build-info.txt"
          grep -Fx 'debuggable=false' "$asset_dir/build-info.txt"
          grep -F 'certificate SHA-256 digest: 8bbb9530cc7954da1fc576f1174dc0dbaaec574d15c024de1ebd6a090d48037a' "$asset_dir/signature.txt"
          apk_sha=$(sha256sum "$apk" | cut -d ' ' -f 1)
          test "$apk_sha" = "$(cut -d ' ' -f 1 "$asset_dir/apk-sha256.txt")"
          printf '%s  %s\n' "$apk_sha" HAWidgets-v0.6.1.1-rc1.apk > "$asset_dir/apk-sha256.txt"
          printf 'sourceCommit=%s\n' "$SOURCE_SHA" >> "$asset_dir/build-info.txt"
          cat > rc-notes.md <<EOF
          ## Русский

          Публичная тестовая версия для Android 12+. Финальный релиз ещё не одобрен: требуется физическая проверка.

          - Исправлено автоматическое появление новых устройств и обновление названий в Dashboard без открытия настроек.
          - Каталог обновляется через фоновую синхронизацию с интервалом 15 минут и при возвращении на экран, если устарел. Android может задержать фоновый запуск. Ручное обновление получает каталог сразу.
          - Сохранены пользовательские порядок, видимость, избранное, группировка, сценарии и настройки таймеров. Учтены удаление и перенос объектов между помещениями.
          - Установите APK поверх v0.6.1 без удаления приложения. Проверьте добавление и переименование без открытия настроек, удаление/перемещение, сохранность порядка/видимости/таймеров.

          ## English

          Public test candidate for Android 12+. Physical verification is required before Final approval.

          Fixes automatic Dashboard catalog discovery and renamed devices/entities/spaces. Preserves user configuration, handles removal and area changes, and keeps state-only updates lightweight. Catalog freshness is 15 minutes, checked by background and foreground reconciliation; Android may defer background execution. Manual refresh reloads the catalog immediately.

          Install over v0.6.1 without uninstalling. Test additions, renames, removals/area moves and retained ordering, visibility and timers.

          ## Build identity

          - Version: 0.6.1.1-rc1 / 45
          - Package: com.danila.hacustomwidgets; minSdk 31; targetSdk 36; debuggable=false
          - Source commit: $SOURCE_SHA
          - APK SHA-256: $apk_sha
          - Signing certificate SHA-256: 8bbb9530cc7954da1fc576f1174dc0dbaaec574d15c024de1ebd6a090d48037a
          - Tests: https://github.com/$GH_REPO/actions/runs/$TEST_RUN_ID
          - Signed build: https://github.com/$GH_REPO/actions/runs/$signed_run

          No Telegram announcement for this RC. Final requires the user's physical-test confirmation and unchanged production code from the approved RC.
          EOF
          # Upload while draft, then publish only as Pre-release, never Latest.
          gh release create "$tag" "$apk" "$asset_dir/apk-sha256.txt" "$asset_dir/build-info.txt" "$asset_dir/signature.txt" \
            --target "$SOURCE_SHA" --title 'HA Custom Widgets v0.6.1.1-rc1' --notes-file rc-notes.md --draft --prerelease --latest=false
          gh release edit "$tag" --draft=false --prerelease --latest=false
          gh release view "$tag" --json url,isDraft,isPrerelease,tagName,targetCommitish

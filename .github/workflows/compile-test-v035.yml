name: v0.6.1-rc3 compile and tests

on:
  push:
  workflow_dispatch:

jobs:
  compile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile and run unit/regression tests
        run: gradle testDebugUnitTest assembleDebugAndroidTest --stacktrace
      - name: Report executed tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          reports = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          if not reports:
              raise SystemExit("No JUnit XML reports found")
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("TEST_RESULT " + " ".join(f"{key}={value}" for key, value in totals.items()))
          if totals["tests"] < 400 or totals["failures"] or totals["errors"] or totals["skipped"]:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v0.6.1-rc3-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: error

  legacy-host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.6.1-rc3-host-api-${{ matrix.api }}
          path: app/build/reports/androidTests/connected

name: v0.7.0 RC compile and tests

on:
  push:
  workflow_dispatch:

jobs:
  compile-test:
    if: ${{ !contains(github.event.head_commit.message, '[publish-reviewed-rc4]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify preserved historical gates and RC scope
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c26bb1af90872db9a6bfb49ede693294d6a2fd51 HEAD
          historical="$RUNNER_TEMP/v063-scope"
          git worktree add --detach "$historical" c26bb1af90872db9a6bfb49ede693294d6a2fd51
          for check in final rc4 rc5 rc6 rc7 rc8; do
            (cd "$historical" && python3 ".github/scripts/verify-$check-scope.py")
          done
          approved="$RUNNER_TEMP/v064-approved"
          git clone --no-local --no-checkout --no-tags . "$approved"
          git -C "$approved" checkout --detach 66298240b6707c3e3d40e6d60ce079e2be664efe
          # The unchanged historical guard checks its historical tag namespace.
          for tag in $(git tag --merged 66298240b6707c3e3d40e6d60ce079e2be664efe); do
            git -C "$approved" fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          done
          (cd "$approved" && python3 .github/scripts/verify-v064-scope.py)
          stable="$RUNNER_TEMP/v064-stable"
          git worktree add --detach "$stable" 273a6d60360b295523f23bd4b416a34ff4cb2d2b
          (cd "$stable" && python3 .github/scripts/verify-v064-final-scope.py)
          rc1="$RUNNER_TEMP/v070-rc1"
          git worktree add --detach "$rc1" afece5e292314a145d4822d7702b992f0f05be1f
          (cd "$rc1" && python3 .github/scripts/verify-v070-scope.py)
          rc2="$RUNNER_TEMP/v070-rc2"
          git worktree add --detach "$rc2" 00fdbf0ab983db90d2ad8f6ff25961fb3e6652dc
          (cd "$rc2" && python3 .github/scripts/verify-v070-rc2-scope.py)
          rc3="$RUNNER_TEMP/v070-rc3"
          git worktree add --detach "$rc3" 42ef1127af68f1b8d475132e92004bb7a0588bca
          (cd "$rc3" && python3 .github/scripts/verify-v070-rc3-scope.py)
          python3 .github/scripts/verify-v070-rc4-scope.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile and run unit/regression tests
        run: gradle testDebugUnitTest assembleDebugAndroidTest --stacktrace
      - name: Report executed tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          reports = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          if not reports:
              raise SystemExit("No JUnit XML reports found")
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("TEST_RESULT " + " ".join(f"{key}={value}" for key, value in totals.items()))
          if totals["tests"] < 475 or totals["failures"] or totals["errors"] or totals["skipped"]:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v0.6.1-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: error

  glance-host:
    if: ${{ !contains(github.event.head_commit.message, '[publish-reviewed-rc4]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [31, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: |
            adb shell cmd uimode night yes
            gradle connectedDebugAndroidTest --stacktrace || { adb logcat -d -s AppWidgetHostView AndroidRuntime; for image in $(adb shell 'ls /data/local/tmp/v070-*.png' | tr -d '\r'); do adb pull "$image" .; done; exit 1; }
            adb pull /data/local/tmp/rc3-floating-window.png rc3-floating-window.png
            for image in brightness color_temp hs color_temp-rgbww; do adb pull "/data/local/tmp/v070-$image.png" "v070-$image.png"; done
            for image in hs color_temp-rgbww; do adb pull "/data/local/tmp/v070-picker-$image.png" "v070-picker-$image.png"; done
            for font in 1.0 1.5 2.0; do for landscape in true false; do adb pull "/data/local/tmp/v070-font-$font-$landscape.png" "v070-font-$font-$landscape.png"; done; done
            for image in $(adb shell 'ls /data/local/tmp/v070-capsule-*.png /data/local/tmp/v070-rc2-style-*.png /data/local/tmp/v070-rc4-*.png' | tr -d '\r'); do adb pull "$image" .; done
      - name: Verify instrumentation test count
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          reports = glob.glob("app/build/outputs/androidTest-results/connected/**/TEST-*.xml", recursive=True)
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("HOST_TEST_RESULT", totals)
          if totals["tests"] < 52 or any(totals[k] for k in ("failures", "errors", "skipped")):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.6.1-glance-api-${{ matrix.api }}
          path: |
            rc3-floating-window.png
            v070-*.png
            seed-result.txt
            pre-upgrade-result.txt
            upgrade-result.txt
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected

  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[publish-reviewed-rc4]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: v0.7.0-rc3
            ref: 42ef1127af68f1b8d475132e92004bb7a0588bca
            fixture: true
            legacy: false
            favorites: true
          - source: v0.7.0-rc3-api36
            ref: 42ef1127af68f1b8d475132e92004bb7a0588bca
            fixture: true
            legacy: false
            favorites: true
            api: 36
          - source: v0.7.0-rc2
            ref: 00fdbf0ab983db90d2ad8f6ff25961fb3e6652dc
            fixture: true
            legacy: false
            favorites: true
          - source: v0.7.0-rc2-api36
            ref: 00fdbf0ab983db90d2ad8f6ff25961fb3e6652dc
            fixture: true
            legacy: false
            favorites: true
            api: 36
          - source: v0.7.0-rc1
            ref: afece5e292314a145d4822d7702b992f0f05be1f
            fixture: true
            legacy: false
            favorites: true
          - source: v0.7.0-rc1-api36
            ref: afece5e292314a145d4822d7702b992f0f05be1f
            fixture: true
            legacy: false
            favorites: true
            api: 36
          - source: v0.6.4
            ref: 273a6d60360b295523f23bd4b416a34ff4cb2d2b
            fixture: true
            legacy: false
            favorites: true
          - source: v0.6.4-api36
            ref: 273a6d60360b295523f23bd4b416a34ff4cb2d2b
            fixture: true
            legacy: false
            favorites: true
            api: 36
          - source: v0.6.0.3
            ref: f8c7a9c8a9a11d823873a274ae9f2eb340314499
          - source: rc6
            ref: 7cd3cc5ca5238cd330c7dedf91f107f33bc3e737
          - source: v0.6.1.1-rc1
            ref: 7fe94a6bee9c0994161a046b73f978b37074043c
          - source: v0.6.3
            ref: c26bb1af90872db9a6bfb49ede693294d6a2fd51
            fixture: true
            legacy: false
          - source: v0.6.3-api36
            ref: c26bb1af90872db9a6bfb49ede693294d6a2fd51
            fixture: true
            legacy: false
            api: 36
          - source: v0.6.4-rc1
            ref: 66298240b6707c3e3d40e6d60ce079e2be664efe
            fixture: true
            legacy: false
            favorites: true
          - source: v0.6.4-rc1-api36
            ref: 66298240b6707c3e3d40e6d60ce079e2be664efe
            fixture: true
            legacy: false
            favorites: true
            api: 36
          - source: v0.6.2
            ref: 718136bb62386ffbfff3bcdd18de4d403ad14d70
            fixture: true
            legacy: false
          - source: v0.6.1
            ref: 8de943565dee235213ae5abb3e87f7bbd08179f2
          - source: stable-without-legacy
            ref: df0fff631634657403b5436d8a7440de91f79cba
            fixture: true
            legacy: false
          - source: stable-with-legacy
            ref: df0fff631634657403b5436d8a7440de91f79cba
            fixture: true
            legacy: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build source and corrective upgrade APKs with one debug certificate
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/upgrade-base"
          git worktree add --detach "$base_dir" "${{ matrix.ref }}"
          gradle -p "$base_dir" assembleDebug --stacktrace
          if [ "${{ matrix.fixture }}" = "true" ]; then
            fixture=app/src/androidTest/java/com/danila/hacustomwidgets/dashboard/DashboardUpgradeTest.kt
            mkdir -p "$base_dir/$(dirname "$fixture")"
            cp "$fixture" "$base_dir/$fixture"
            gradle -p "$base_dir" assembleDebugAndroidTest --stacktrace
            cp "$base_dir/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" "$RUNNER_TEMP/source-test.apk"
          fi
          cp "$base_dir/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/source.apk"
          gradle assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api || 31 }}
          arch: x86_64
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/source.apk"
            adb shell run-as com.danila.hacustomwidgets mkdir -p files
            adb shell run-as com.danila.hacustomwidgets touch files/upgrade-marker
            if [ "${{ matrix.fixture }}" = "true" ]; then adb install "$RUNNER_TEMP/source-test.apk"; adb shell appwidget grantbind --package com.danila.hacustomwidgets --user 0; adb shell am instrument -w -e class com.danila.hacustomwidgets.dashboard.DashboardUpgradeTest -e upgradePhase seed -e withLegacy "${{ matrix.legacy }}" -e withFavorites "${{ matrix.favorites || false }}" com.danila.hacustomwidgets.test/androidx.test.runner.AndroidJUnitRunner | tee seed-result.txt; grep -F 'OK (1 test)' seed-result.txt; fi
            if [ "${{ matrix.fixture }}" = "true" ]; then adb shell am instrument -w -e class com.danila.hacustomwidgets.dashboard.DashboardUpgradeTest -e upgradePhase preUpgrade com.danila.hacustomwidgets.test/androidx.test.runner.AndroidJUnitRunner | tee pre-upgrade-result.txt; grep -F 'OK (1 test)' pre-upgrade-result.txt; fi
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell run-as com.danila.hacustomwidgets ls files/upgrade-marker | grep -F 'files/upgrade-marker'
            if [ "${{ matrix.fixture }}" = "true" ]; then adb shell am instrument -w -e class com.danila.hacustomwidgets.dashboard.DashboardUpgradeTest -e upgradePhase verify com.danila.hacustomwidgets.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-result.txt; grep -F 'OK (1 test)' upgrade-result.txt; fi
            adb shell cmd uimode night yes
            gradle connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.6.1-upgrade-${{ matrix.source }}-api-${{ matrix.api || 31 }}
          path: |
            seed-result.txt
            pre-upgrade-result.txt
            upgrade-result.txt
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected

  fixture-persistence-diagnostic:
    # Reproduce the original fixture failure before any APK upgrade, then verify the fix.
    if: github.ref == 'refs/heads/feature/remove-entity-widget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build unchanged stable app and original versus corrected test APKs
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/stable" df0fff631634657403b5436d8a7440de91f79cba
          gradle -p "$RUNNER_TEMP/stable" assembleDebug
          cp "$RUNNER_TEMP/stable/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/stable.apk"
          fixture=app/src/androidTest/java/com/danila/hacustomwidgets/dashboard/DashboardUpgradeTest.kt
          cp "$fixture" "$RUNNER_TEMP/corrected.kt"
          git show 7f133dd7aafb60c937c5c7e3067596806a9a6502:"$fixture" > "$fixture"
          gradle assembleDebugAndroidTest
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/original-test.apk"
          cp "$RUNNER_TEMP/corrected.kt" "$fixture"
          gradle assembleDebugAndroidTest
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/corrected-test.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/stable.apk"
            bash .github/scripts/diagnose-fixture-persistence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-persistence-evidence
          path: fixture-evidence/


name: v0.6.3 compile and tests

on:
  push:
  workflow_dispatch:

jobs:
  compile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify RC lineage and monotonic version
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 718136bb62386ffbfff3bcdd18de4d403ad14d70 HEAD
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          current = Path("app/build.gradle.kts").read_text()
          assert 'versionName = "0.6.3-rc1"' in current
          assert 'versionCode = 50' in current
          base = subprocess.check_output(["git", "show", "v0.6.2:app/build.gradle.kts"], text=True)
          assert current == base.replace("versionCode = 49", "versionCode = 50").replace('versionName = "0.6.2"', 'versionName = "0.6.3-rc1"')
          refs = subprocess.check_output(["git", "for-each-ref", "--format=%(refname)", "refs/tags"], text=True).splitlines()
          for ref in refs:
              old = subprocess.check_output(["git", "show", f"{ref}:app/build.gradle.kts"], text=True)
              code = re.search(r"versionCode\s*=\s*(\d+)", old)
              assert code and int(code[1]) < 50, (ref, code)
          print("RC_LINEAGE_PASS: v0.6.2 ancestor; versionCode=50; signing, SDK and dependencies unchanged")
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile and run unit/regression tests
        run: gradle testDebugUnitTest assembleDebugAndroidTest --stacktrace
      - name: Report executed tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          reports = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          if not reports:
              raise SystemExit("No JUnit XML reports found")
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("TEST_RESULT " + " ".join(f"{key}={value}" for key, value in totals.items()))
          if totals["tests"] < 414 or totals["failures"] or totals["errors"] or totals["skipped"]:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v0.6.1-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: error

  glance-host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [31, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace || { adb logcat -d -s AppWidgetHostView AndroidRuntime; exit 1; }
      - name: Verify instrumentation test count
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          reports = glob.glob("app/build/outputs/androidTest-results/connected/**/TEST-*.xml", recursive=True)
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("HOST_TEST_RESULT", totals)
          if totals["tests"] < 10 or any(totals[k] for k in ("failures", "errors", "skipped")):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.6.1-glance-api-${{ matrix.api }}
          path: |
            seed-result.txt
            pre-upgrade-result.txt
            upgrade-result.txt
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected

  upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: v0.6.0.3
            ref: f8c7a9c8a9a11d823873a274ae9f2eb340314499
          - source: rc6
            ref: 7cd3cc5ca5238cd330c7dedf91f107f33bc3e737
          - source: v0.6.1.1-rc1
            ref: 7fe94a6bee9c0994161a046b73f978b37074043c
          - source: v0.6.2
            ref: 718136bb62386ffbfff3bcdd18de4d403ad14d70
            fixture: true
            legacy: false
          - source: v0.6.1
            ref: 8de943565dee235213ae5abb3e87f7bbd08179f2
          - source: stable-without-legacy
            ref: df0fff631634657403b5436d8a7440de91f79cba
            fixture: true
            legacy: false
          - source: stable-with-legacy
            ref: df0fff631634657403b5436d8a7440de91f79cba
            fixture: true
            legacy: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build source and corrective upgrade APKs with one debug certificate
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/upgrade-base"
          git worktree add --detach "$base_dir" "${{ matrix.ref }}"
          gradle -p "$base_dir" assembleDebug --stacktrace
          if [ "${{ matrix.fixture }}" = "true" ]; then
            fixture=app/src/androidTest/java/com/danila/hacustomwidgets/dashboard/DashboardUpgradeTest.kt
            mkdir -p "$base_dir/$(dirname "$fixture")"
            cp "$fixture" "$base_dir/$fixture"
            gradle -p "$base_dir" assembleDebugAndroidTest --stacktrace
            cp "$base_dir/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" "$RUNNER_TEMP/source-test.apk"
          fi
          cp "$base_dir/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/source.apk"
          gradle assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/source.apk"
            adb shell run-as com.danila.hacustomwidgets mkdir -p files
            adb shell run-as com.danila.hacustomwidgets touch files/upgrade-marker
            if [ "${{ matrix.fixture }}" = "true" ]; then adb install "$RUNNER_TEMP/source-test.apk"; adb shell appwidget grantbind --package com.danila.hacustomwidgets --user 0; adb shell am instrument -w -e class com.danila.hacustomwidgets.dashboard.DashboardUpgradeTest -e upgradePhase seed -e withLegacy "${{ matrix.legacy }}" com.danila.hacustomwidgets.test/androidx.test.runner.AndroidJUnitRunner | tee seed-result.txt; grep -F 'OK (1 test)' seed-result.txt; fi
            if [ "${{ matrix.fixture }}" = "true" ]; then adb shell am instrument -w -e class com.danila.hacustomwidgets.dashboard.DashboardUpgradeTest -e upgradePhase preUpgrade com.danila.hacustomwidgets.test/androidx.test.runner.AndroidJUnitRunner | tee pre-upgrade-result.txt; grep -F 'OK (1 test)' pre-upgrade-result.txt; fi
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell run-as com.danila.hacustomwidgets ls files/upgrade-marker | grep -F 'files/upgrade-marker'
            if [ "${{ matrix.fixture }}" = "true" ]; then adb shell am instrument -w -e class com.danila.hacustomwidgets.dashboard.DashboardUpgradeTest -e upgradePhase verify com.danila.hacustomwidgets.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-result.txt; grep -F 'OK (1 test)' upgrade-result.txt; fi
            gradle connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.6.1-upgrade-${{ matrix.source }}-api-31
          path: |
            seed-result.txt
            pre-upgrade-result.txt
            upgrade-result.txt
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected

  fixture-persistence-diagnostic:
    # Reproduce the original fixture failure before any APK upgrade, then verify the fix.
    if: github.ref == 'refs/heads/feature/remove-entity-widget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build unchanged stable app and original versus corrected test APKs
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/stable" df0fff631634657403b5436d8a7440de91f79cba
          gradle -p "$RUNNER_TEMP/stable" assembleDebug
          cp "$RUNNER_TEMP/stable/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/stable.apk"
          fixture=app/src/androidTest/java/com/danila/hacustomwidgets/dashboard/DashboardUpgradeTest.kt
          cp "$fixture" "$RUNNER_TEMP/corrected.kt"
          git show 7f133dd7aafb60c937c5c7e3067596806a9a6502:"$fixture" > "$fixture"
          gradle assembleDebugAndroidTest
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/original-test.apk"
          cp "$RUNNER_TEMP/corrected.kt" "$fixture"
          gradle assembleDebugAndroidTest
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/corrected-test.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/stable.apk"
            bash .github/scripts/diagnose-fixture-persistence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-persistence-evidence
          path: fixture-evidence/


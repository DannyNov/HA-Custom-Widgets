name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HA_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/ha-custom-widgets-debug.jks
      HA_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.HA_DEBUG_KEYSTORE_PASSWORD }}
      HA_DEBUG_KEY_ALIAS: ${{ secrets.HA_DEBUG_KEY_ALIAS }}
      HA_DEBUG_KEY_PASSWORD: ${{ secrets.HA_DEBUG_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare permanent debug signing key
        env:
          HA_DEBUG_KEYSTORE_BASE64: ${{ secrets.HA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HA_DEBUG_KEYSTORE_BASE64"
          test -n "$HA_DEBUG_KEYSTORE_PASSWORD"
          test -n "$HA_DEBUG_KEY_ALIAS"
          test -n "$HA_DEBUG_KEY_PASSWORD"
          printf '%s' "$HA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HA_DEBUG_KEYSTORE_PATH"
          chmod 600 "$HA_DEBUG_KEYSTORE_PATH"
          keytool -list \
            -keystore "$HA_DEBUG_KEYSTORE_PATH" \
            -storepass "$HA_DEBUG_KEYSTORE_PASSWORD" \
            -alias "$HA_DEBUG_KEY_ALIAS" > /dev/null
      - name: Compile and test
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HA-Custom-Widgets-v0.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

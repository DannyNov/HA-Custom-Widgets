name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HA_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.HA_DEBUG_KEYSTORE_PASSWORD }}
      HA_DEBUG_KEY_ALIAS: ${{ secrets.HA_DEBUG_KEY_ALIAS }}
      HA_DEBUG_KEY_PASSWORD: ${{ secrets.HA_DEBUG_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare permanent debug signing key
        env:
          HA_DEBUG_KEYSTORE_BASE64: ${{ secrets.HA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HA_DEBUG_KEYSTORE_BASE64"
          test -n "$HA_DEBUG_KEYSTORE_PASSWORD"
          test -n "$HA_DEBUG_KEY_ALIAS"
          test -n "$HA_DEBUG_KEY_PASSWORD"
          keystore_path="$RUNNER_TEMP/ha-custom-widgets-debug.jks"
          printf '%s' "$HA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$HA_DEBUG_KEYSTORE_PASSWORD" \
            -alias "$HA_DEBUG_KEY_ALIAS" > /dev/null
          printf 'HA_DEBUG_KEYSTORE_PATH=%s\n' "$keystore_path" >> "$GITHUB_ENV"
      - name: Compile and test
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          report="app/build/outputs/apk/debug/signature.txt"
          "$APKSIGNER" verify --verbose --print-certs "$apk" | tee "$report"
          actual_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$report" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected_cert="8bbb9530cc7954da1fc576f1174dc0dbaaec574d15c024de1ebd6a090d48037a"
          test "$actual_cert" = "$expected_cert"
          sha256sum "$apk" | tee app/build/outputs/apk/debug/apk-sha256.txt
          cp "$apk" app/build/outputs/apk/debug/HAWidgets-v0.3.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HA-Custom-Widgets-v0.3.2-debug
          path: |
            app/build/outputs/apk/debug/HAWidgets-v0.3.2.apk
            app/build/outputs/apk/debug/signature.txt
            app/build/outputs/apk/debug/apk-sha256.txt
          if-no-files-found: error
